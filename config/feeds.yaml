# ──────────────────────────────────────────────────────────────────
# Monitor Regulatorio de Protección de Datos Personales - Sakbé
# ──────────────────────────────────────────────────────────────────
#
# Fuente del inventario de autoridades:
#   "Autoridades de Protección de Datos Personales — Europa y
#    Latinoamérica" (insumo, verificado 17-sep-2026), secciones
#    1.1 (27 autoridades UE), 1.2 (órganos de coordinación UE) y
#    2 (Latinoamérica, tabla principal).
#   Quedan fuera por indicación expresa: 1.3 (EEE), 1.4 (Reino Unido
#   y Suiza), 2.1 (países sin autoridad) y 2.2 (marco parcial).
#
# Campos por fuente:
#   regulator      Acrónimo de la autoridad. Debe coincidir EXACTO con una
#                  opción del select "Regulador" en Notion. Cuando dos
#                  autoridades comparten acrónimo (CNPD, ÚOOÚ, ANPD,
#                  Datatilsynet) se desambigua con el país entre paréntesis.
#   authority      Nombre completo oficial. Solo documentación, no va a Notion.
#   region         "Europa" o "LatAm". Controla la pestaña del dashboard.
#                  Debe coincidir con el select "Region" en Notion.
#   country        Código de país (ISO 2 letras) o "UE" para los órganos
#                  de coordinación. Select "Pais" en Notion.
#   type           Sección del sitio que se lee. Select "Tipo" en Notion.
#   site           Sitio oficial de la autoridad. NO cambia nunca. Es lo
#                  que sondea tools/discover_feeds.py.
#   url            URL del feed RSS o de la página a scrapear. Vacío
#                  mientras la fuente no esté verificada.
#   source         "rss"      -> url es un feed RSS/Atom estándar.
#                  "scraper"  -> url es HTML y scraper_module lo parsea.
#                  "pending"  -> todavía no se verificó nada. El ingest
#                                lo salta sin error.
#   scraper_module Solo si source es "scraper". Módulo en src/scrapers/.
#   enabled        false mientras la fuente no esté verificada. El ingest
#                  solo procesa fuentes con enabled: true.
#   note           Observación relevante (autoridad en transición, etc.).
#
# ESTADO (tras la corrida de descubrimiento del 17-sep-2026, ver
# config/discovery-report.md):
#
#   11 fuentes ACTIVAS con RSS verificado.
#
#    3 fuentes con RSS encontrado pero DESCARTADO: AAIP, ANPD (BR) y
#      ANPD (PE). El feed hallado es del portal de gobierno completo
#      (argentina.gob.ar, gov.br, gob.pe), no de la autoridad. Como el
#      pipeline no filtra por tema, habilitarlos llenaría la base de
#      noticias ajenas. Quedan pendientes hasta encontrar un feed de
#      sección o escribirles scraper.
#
#   24 fuentes SIN RSS: necesitan scraper. Entre ellas las de mayor
#      valor del bloque europeo (AEPD, Garante, DPC irlandesa, EDPS).
#
#    2 fuentes INACCESIBLES por certificado TLS inválido: SIC (CO)
#      y KZLD (BG). No es un problema del monitor: esos sitios sirven
#      un certificado que Python rechaza. AZOP (HR) estaba en esta
#      lista y se resolvió en la segunda corrida: el certificado roto
#      es el de www.azop.hr, el dominio sin www responde bien.
#
# Al habilitar una fuente: llenar url, poner source rss o scraper, y
# enabled true. El campo site nunca se toca.
#
# ──────────────────────────────────────────────────────────────────

settings:
  # Solo se insertan items cuya fecha de publicación sea menor o igual
  # a este número de días. Items sin fecha se dejan pasar.
  max_age_days: 20

  # Ventana que se PUBLICA en docs/data/monitor.json y por lo tanto lo
  # que ve el dashboard. Notion conserva el histórico completo.
  display_window_days: 20

  # Pestañas del dashboard, en orden. El dashboard las lee del JSON,
  # esto solo documenta el contrato.
  regions: ["LatAm", "Europa"]

feeds:

