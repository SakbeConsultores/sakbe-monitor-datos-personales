# ──────────────────────────────────────────────────────────────────
# Workflow de ingesta - Monitor de Protección de Datos Personales
# ──────────────────────────────────────────────────────────────────
#
# Mismo esquema que el Monitor de Reguladores Financieros: corre 2
# veces al día, inserta lo nuevo en Notion, exporta el JSON y lo
# commitea para que GitHub Pages lo sirva.
#
# Las credenciales (NOTION_TOKEN y NOTION_DATABASE_ID) se inyectan
# desde los Secrets del repo. Son DISTINTAS a las del monitor
# financiero: mismo token de integración si reusas la conexión, pero
# el DATABASE_ID apunta a la base nueva de protección de datos.
# ──────────────────────────────────────────────────────────────────

name: Ingest Protección de Datos

on:
  schedule:
    # 9:05 am CDMX = 15:05 UTC
    - cron: '5 15 * * *'
    # 3:05 pm CDMX = 21:05 UTC
    - cron: '5 21 * * *'

  # Disparo manual desde la pestaña Actions. Esencial para el primer
  # test y para forzar corridas.
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Playwright agrega ~2-3 minutos por la descarga inicial de Chromium
    # y los renderizados. Con 40 fuentes conviene margen amplio.
    timeout-minutes: 30

    # Escritura para poder commitear el JSON exportado.
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cacheamos Chromium para no re-descargar ~300 MB cada corrida.
      # El key incluye el hash de requirements.txt para invalidarse
      # automáticamente al subir la versión de Playwright.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser + system deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      # Con cache el binario está, pero las deps del SO no persisten
      # entre runners. Se instalan rápido sin re-descargar el browser.
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run ingest
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python src/ingest.py

      - name: Commit JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/monitor.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el JSON, no se commitea."
          else
            git commit -m "auto: update monitor.json"
            git push
          fi
